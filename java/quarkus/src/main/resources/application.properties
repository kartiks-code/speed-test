# HTTP server
quarkus.http.port=8080
quarkus.http.root-path=/api/v3

# PostgreSQL datasource (override any key via the matching environment variable)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:myuser}
quarkus.datasource.password=${POSTGRES_PASSWORD:mypassword}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:java-quarkus}
quarkus.datasource.jdbc.max-size=5

# Logging
quarkus.log.level=INFO
