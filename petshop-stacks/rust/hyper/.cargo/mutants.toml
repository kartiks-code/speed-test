# cargo-mutants configuration.
# Install: cargo install cargo-mutants
# Run:     cargo mutants
#
# Only the hand-written helper modules are mutated:
#   src/helpers.rs    — row_to_pet / row_to_order / row_to_user
#   src/db_config.rs  — build_dsn / pool_max_connections
#
# All generated code (src/lib.rs, src/models.rs, src/server/*, src/client/*,
# src/auth.rs, src/context.rs, src/header.rs, bin/**) is excluded so the
# mutation run stays fast and actionable.

examine_globs = [
    "src/helpers.rs",
    "src/db_config.rs",
]
