[package]
name = "petstore-actix"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "petstore-actix"
path = "src/main.rs"

[dependencies]
actix-web = "4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
bytes = "1"
