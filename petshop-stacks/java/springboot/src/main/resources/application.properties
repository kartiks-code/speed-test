server.port=8080
spring.threads.virtual.enabled=true
spring.jackson.date-format=org.openapitools.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:java-springboot}}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver
# Request handling runs on virtual threads (spring.threads.virtual.enabled), so the pool
# should be large rather than capped like a platform-thread pool — HikariCP's default of 10
# needlessly bottlenecks concurrency. Keep it >= the benchmark VU count. Bounded by Postgres
# max_connections (500); override with SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE.
spring.datasource.hikari.maximum-pool-size=200
spring.main.lazy-initialization=true
