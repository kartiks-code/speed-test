# HTTP server
quarkus.http.port=8080
quarkus.http.root-path=/api/v3

# PostgreSQL datasource (override any key via the matching environment variable)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:myuser}
quarkus.datasource.password=${POSTGRES_PASSWORD:mypassword}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:java-quarkus}?prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&reWriteBatchedInserts=true
# Endpoints run on virtual threads (@RunOnVirtualThread), so the pool should be large:
# a small pool both bottlenecks concurrency and deadlocks (Agroal connection acquisition
# pins the limited carrier threads under --cpus 2, so VUs waiting for a connection starve
# the VUs holding them). Keep it >= the benchmark VU count. Bounded by Postgres
# max_connections (500); override with QUARKUS_DATASOURCE_JDBC_MAX_SIZE.
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:200}

# In-process Caffeine cache: pets (10 s TTL, max 1000 entries) +
# inventory (2 s TTL — short enough to stay near-correct during writes).
quarkus.cache.caffeine."pets".expire-after-write=10S
quarkus.cache.caffeine."pets".maximum-size=1000
quarkus.cache.caffeine."inventory".expire-after-write=2S
quarkus.cache.caffeine."inventory".maximum-size=1

# Logging
quarkus.log.level=INFO
