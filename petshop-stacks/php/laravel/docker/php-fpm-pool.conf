; Benchmark pool sizing for --cpus 2 / --memory 512m.
; Named zzz-* so it loads after the base image's zz-docker.conf.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; The base image defaults access.log to stderr; per-request logging is pure
; overhead for the benchmark (nginx access_log is off for the same reason).
access.log = /dev/null

; Container env (--env-file) must reach the workers (DB_*, APP_KEY, ...).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
